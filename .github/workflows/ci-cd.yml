name: CI/CD

# CI runs on every push and PR to main.
# Production deploy to https://vishwa-vani.co.uk runs ONLY on main, ONLY after CI passes.
# Secrets live in the GitHub "production" Environment (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID).
# App secrets (GEMINI_API_KEY etc.) live in Vercel and are pulled at build time — never stored in GitHub.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 1 * *' # Monthly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://vishwa-vani.co.uk


